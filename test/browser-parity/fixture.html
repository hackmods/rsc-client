<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bank UI browser fixture</title>
    <style>
        :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #111820; color: #ecf2f6; }
        header { padding: 10px 14px; background: #382300; border-bottom: 1px solid #bd7b00; }
        header strong { color: #ffd778; letter-spacing: .05em; }
        header p { margin: 2px 0 0; color: #d0d6dc; font-size: 12px; }
        main { display: grid; min-height: calc(100vh - 68px); place-items: center; padding: 12px; }
        #screen { display: block; width: min(100%, 800px); height: auto; image-rendering: pixelated; box-shadow: 0 8px 36px #0009; }
        #fixture-result { position: fixed; right: 10px; bottom: 8px; padding: 5px 8px; border-radius: 4px; background: #16232de8; color: #d0e5f1; font: 11px/1.3 ui-monospace, monospace; }
        body[data-mode="mobile"] main { padding: 0; }
        body[data-mode="mobile"] #screen { width: min(100vw, 512px); }
        @media (max-width: 600px) {
            header { padding: 8px 10px; }
            header p { font-size: 11px; }
            main { min-height: calc(100vh - 70px); padding: 0; }
            #fixture-result { right: 5px; bottom: 5px; max-width: 95vw; font-size: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <strong>SIMULATED GAME UI FIXTURE · NOT A LIVE BANK OR PLAYER ACCOUNT</strong>
        <p>Real client bank, status overlay and private-message drawing code. Inventory rows, icons and server replies are synthetic test data.</p>
    </header>
    <main><canvas id="screen" aria-label="Simulated game canvas"></canvas></main>
    <output id="fixture-result" aria-live="polite">Loading the real client bitmap font…</output>
    <script src="/fixture.js"></script>
</body>
</html>
